# ============================================================
# CreditoTiendasDB — Perfil de TESTING (test)
# ============================================================
# Base de datos: H2 en memoria (igual que dev)
# Se activa automáticamente en @SpringBootTest y @DataJpaTest
# No necesita .env ni variables externas
# ============================================================

# --- H2 en memoria para tests ---
spring.datasource.url=jdbc:h2:mem:creditotiendas_test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console desactivada en tests
spring.h2.console.enabled=false

# SQL visible para debug de tests fallidos
spring.jpa.show-sql=true

# --- Valores fijos para tests (no dependen de .env) ---
jwt.secret=test-secret-key-only-for-automated-tests-not-real
jwt.expiration=86400000
cloudinary.url=
iam.seed.system-admin.email=admin@test.local
iam.seed.system-admin.password=test-admin-password
cors.allowed-origins=http://localhost:[*]