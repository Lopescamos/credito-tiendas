# ============================================================
# CreditoTiendasDB — Perfil de PRODUCCIÓN (prod)
# ============================================================
# Base de datos: Supabase (PostgreSQL)
# Secretos: variables de entorno configuradas en Render
# Uso: deploy en Render
# ============================================================

# --- Supabase PostgreSQL (todo desde variables de entorno de Render) ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway aplica las migraciones pendientes de db/migration al arrancar.
# Hibernate solo valida que las tablas coincidan con las entidades, NO crea ni modifica
spring.jpa.hibernate.ddl-auto=validate

# H2 desactivado en producción
spring.h2.console.enabled=false

# No mostrar SQL en producción
spring.jpa.show-sql=false

# --- Secretos (variables de entorno de Render) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CORS: URL del frontend en Vercel (obligatoria, sin default) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Cloudinary ---
cloudinary.url=${CLOUDINARY_URL}

# --- Redis: caché del catálogo activo por tienda. Opcional de verdad: si REDIS_HOST no está
# configurado todavía (no hay proveedor elegido), la app arranca igual contra "localhost" (no
# habrá nada ahí) y CatalogCacheErrorHandler registra el fallo como warning sin romper el
# request — igual que Cloudinary con CLOUDINARY_URL vacío. Configurar REDIS_HOST en Render
# cuando se elija el proveedor. ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m