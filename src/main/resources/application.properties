# ============================================================
# CreditoTiendasDB — Configuración base
# ============================================================
# Este archivo carga siempre. El perfil activo determina
# cuál application-{perfil}.properties se carga encima.
# Default: dev (H2 en memoria, sin secretos de producción)
# ============================================================

spring.application.name=creditotiendas-backend

# --- Perfil activo ---
# En local: dev (default si no se define APP_PROFILE)
# En Render: prod (se configura como variable de entorno)
spring.profiles.active=${APP_PROFILE:dev}

# --- Servidor ---
server.port=${PORT:8080}

# --- JPA global ---
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Tablas en plural y snake_case: CreditSalePersistenceEntity -> credit_sales
spring.jpa.hibernate.naming.physical-strategy=pe.edu.upc.center.creditotiendas.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# --- i18n (messages.properties = inglés base, messages_es.properties = español) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Sin esto, un request en inglés en un servidor con locale es_PE recibiría mensajes en español
spring.messages.fallback-to-system-locale=false

# --- Actuator (health check para Render) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Swagger / SpringDoc ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Maven reemplaza @...@ con los valores del pom.xml al compilar
documentation.application.description=@project.description@
documentation.application.version=@project.version@