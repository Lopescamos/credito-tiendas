# ============================================================
# CreditoTiendasDB — Configuración base
# ============================================================
# Este archivo carga siempre. El perfil activo determina
# cuál application-{perfil}.properties se carga encima.
# Default: dev (H2 en memoria, sin secretos de producción)
# ============================================================

spring.application.name=creditotiendas-backend

# --- Perfil activo ---
# En local: dev (default si no se define APP_PROFILE)
# En Render: prod (se configura como variable de entorno)
spring.profiles.active=${APP_PROFILE:dev}

# --- Servidor ---
server.port=${PORT:8080}

# --- JPA global ---
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Tablas en plural y snake_case: CreditSalePersistenceEntity -> credit_sales
spring.jpa.hibernate.naming.physical-strategy=pe.edu.upc.center.creditotiendas.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# --- Flyway: migraciones versionadas en src/main/resources/db/migration (V1__..., V2__...) ---
spring.flyway.locations=classpath:db/migration

# --- i18n (messages.properties = inglés base, messages_es.properties = español) ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Sin esto, un request en inglés en un servidor con locale es_PE recibiría mensajes en español
spring.messages.fallback-to-system-locale=false

# --- IAM: Admin Sistema inicial ---
# Se crea al arrancar solo si no existe ningún SYSTEM_ADMIN. Si faltan, se omite con un warning.
iam.seed.system-admin.email=${ADMIN_EMAIL:}
iam.seed.system-admin.password=${ADMIN_PASSWORD:}

# --- CORS: orígenes del frontend (lista separada por comas, admite patrones) ---
# Default para desarrollo: cualquier puerto de localhost. En prod se sobreescribe con CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*]}

# --- Uploads: imágenes de productos (máx. 5 MB; el command también lo valida) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Actuator (health check para Render) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# --- Swagger / SpringDoc ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Maven reemplaza @...@ con los valores del pom.xml al compilar
documentation.application.description=@project.description@
documentation.application.version=@project.version@