# ============================================================
# Base messages (English). Spanish overrides: messages_es.properties
# ============================================================
# Error messages used by ErrorResponseAssembler.
# Arguments: {0} = error details, {1} = entity name from the error code
# A bounded context can add a specific key for one error code, e.g.:
#   error.credit-sale-not-found.message=Credit sale {0} was not found
# ============================================================

error.validation.message=The request contains invalid data
error.unauthorized.message=Authentication is required
error.forbidden.message=You do not have permission to perform this operation
error.not-found.message=The requested {1} was not found
error.conflict.message=The operation conflicts with the current state of {1}
error.business-rule.message=The operation violates a business rule
error.unexpected.message=An unexpected error occurred
error.generic.message=The request could not be processed
