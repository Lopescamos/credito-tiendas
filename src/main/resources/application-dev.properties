# ============================================================
# CreditoTiendasDB — Perfil de DESARROLLO (dev)
# ============================================================
# Base de datos: H2 en memoria (no necesita instalación)
# Secretos: se leen del archivo .env local via spring-dotenv
# Uso: desarrollo local en tu PC
# ============================================================

# --- H2 en memoria (hardcodeado, no es secreto) ---
spring.datasource.url=jdbc:h2:mem:creditotiendas_dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear tablas automáticamente al iniciar, borrar al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web de H2 para inspeccionar datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostrar SQL en desarrollo para debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Secretos de desarrollo (se leen del .env) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Cloudinary (opcional en dev, vacío si no se usa) ---
cloudinary.url=${CLOUDINARY_URL:}